<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="description" content="Gestão financeira completa com controle de contas, cartões e metas via Inteligência Artificial.">
    <title>FinanceApp - Inteligência Financeira</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/C51RVqCB/financeapp-logo.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/C51RVqCB/financeapp-logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <!-- PayPal SDK: Estabilizado com crossorigin e source factory -->
    <script 
      src="https://www.paypal.com/sdk/js?client-id=ASWKvSJFWVfA6Ozq0fEHh-IOxASMglLgDCEQohznbJrtwUwVbfpIiQLiTyuQy9d8w0TjT-2wn-W_qNKR&currency=BRL&components=buttons&intent=capture" 
      crossorigin="anonymous"
      data-sdk-integration-source="button-factory"
      defer
    ></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' },
              success: '#10b981', warning: '#f59e0b', danger: '#ef4444',
            },
            keyframes: {
              'pulse-scale': { '0%, 100%': { transform: 'scale(1)', opacity: '1' }, '50%': { transform: 'scale(1.05)', opacity: '0.8' } },
              'fade-in-up': { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
            },
            animation: { 'pulse-scale': 'pulse-scale 2s cubic-bezier(0.4, 0, 0.6, 1) infinite', 'fade-in-up': 'fade-in-up 0.4s ease-out forwards' }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
      .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
